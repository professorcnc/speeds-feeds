<!DOCTYPE html>
<html>
<head>
  <title>Test Worksheet</title>
</head>

<body>

<h2>Q1 – Milling RPM</h2>
<p>0.5" tool, 600 SFM</p>

<input id="q1">
<button onclick="checkQ1()">Check</button>

<div id="r1"></div>


<script>
function checkQ1(){
  let ans = document.getElementById("q1").value;
  let correct = 4584;

  if(Math.abs(ans - correct) < 200){
    document.getElementById("r1").innerHTML = "✅ Correct";
  } else {
    document.getElementById("r1").innerHTML = "❌ Try again";
  }
}
</script>

</body>
</html>
